defaults:
  - encoder: meds_code
  - query_projector: sequence_mean
  - retriever: in_memory
  - retrieval_encoder: mean_pooled
  - fusion: replace
  - pooling: identity
  - head: linear
  - training/module: supervised_lightning
  - training/task: binary_classification
  - training/loss: binary_bce
  - training/datamodule: meds
  - training/trainer: lightning_eval
  - _self_

head:
  out_dim: ${training.task.output_dim}

# Must match the checkpoint's training config, so the model is rebuilt with the same output path
# (a marginalized checkpoint loads fine into a non-marginalized model and silently predicts wrong).
marginalized_retrieval: false
marginalized_score_similarity: dot
marginalized_output_mode: categorical # categorical | binary

output_dir: ???
checkpoint_path: ???
index_dataframe_dir: ???
splits: [train, tuning, held_out]
batch_size: 32
do_overwrite: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
