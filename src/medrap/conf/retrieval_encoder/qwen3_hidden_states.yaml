# Contextual token vectors for retrieved documents: a frozen Qwen3 runs over each document and
# its last-layer output per token is the memory (no trained parameters). Set layer_mix=true for a
# learned mix of all layers. The corpus's doc_tokens must come from the same tokenizer
# (medrap-prepare-retrieval-dataset with Qwen/Qwen3-Embedding-0.6B). Pair with a fusion whose
# d_in_doc is 1024.
_target_: medrap.model.retrieval_encoder.QwenHiddenStatesRetrievalEncoder
pretrained_model_name_or_path: Qwen/Qwen3-Embedding-0.6B
layer_mix: false
torch_dtype: bfloat16
