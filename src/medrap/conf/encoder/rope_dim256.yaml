# Time-delta RoPE encoder (256-D), largest/most "realistic" rung of the capacity sweep.
# fusion.d_in_patient interpolates from ${encoder.embedding_dim}; pass query_projector.in_dim=256.
_target_: medrap.model.encoders.TimeDeltaRoPEPatientEncoder
vocab_size: 65536
embedding_dim: 256
num_heads: 8
num_layers: 4
ff_dim: 512
dropout: 0.0
