# Time-delta RoPE encoder (64-D), capacity sweep rung between rope_dim16 and rope.yaml (128-D).
# fusion.d_in_patient interpolates from ${encoder.embedding_dim}; pass query_projector.in_dim=64.
_target_: medrap.model.encoders.TimeDeltaRoPEPatientEncoder
vocab_size: 65536
embedding_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128
dropout: 0.0
