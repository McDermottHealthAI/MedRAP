meds_data_dir: ???
output_dir: ???
tensorized_dir: null # provide to skip stages 1 + 2 (MEDS-transforms + MTD_preprocess)
min_subjects_per_code: 100
min_events_per_subject: 10
num_tasks: 25
horizon_days: 7.0
min_history_days: 1.0
seed: 42
code_selection: random # random | most_frequent
anchor_strategy: uniform_event # uniform_event | uniform_lifetime
duration_distribution: fixed # fixed | uniform | log-uniform
min_duration_days: null # required (and only used) when duration_distribution != fixed
max_duration_days: null # required (and only used) when duration_distribution != fixed
do_overwrite: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
