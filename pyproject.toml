[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrap"
dynamic = ["version"]
authors = [
  {name="Matthew McDermott", email="mattmcdermott8@gmail.com"},
  {name="Egill A. Fridgeirsson", email="egillax@gmail.com"},
]
description = "Retrieval-augmented pretraining components for MEDS-style EHR data"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "datasets==4.8.2",
  "faiss-cpu==1.13.2",
  "hydra-core==1.3.2",
  "hydra-zen==0.16.0",
  "lightning==2.6.1",
  "MEDS-transforms==0.5.3",
  "meds-torch-data==0.6.6",
  "sentence-transformers==5.3.0",
  "torch==2.10.0",
  "torchmetrics>=1.4.0",
  "wandb>=0.16.0",
  "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
prep = [
  "sentence-transformers",
  "transformers",
]
wandb = [
  "wandb>=0.16.0",
]
viz = [
  "matplotlib>=3.8",
  "umap-learn>=0.5",
]
llm_judge = [
  "openai>=1.0.0",
  "tiktoken>=0.7.0",
  "xlsxwriter>=3.2",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
  "pre-commit<4",
  "ruff",
  "pytest",
  "pytest-cov",
  "pretty-print-directory",
  "ipykernel>=7.2.0",
  "notebook>=7.5.5",
]
docs = []
llm_judge = [
  "openai>=1.0.0",
  "tiktoken>=0.7.0",
  "xlsxwriter>=3.2",
  "openpyxl>=3.1",
]
viz = [
  "matplotlib>=3.8",
  "umap-learn>=0.5",
]

[tool.uv]
# Install the llm_judge and viz dependency-groups on every `uv sync` so the
# extraction-plot pipeline (matplotlib, umap-learn) and LLM-judge pipeline
# (xlsxwriter, openpyxl, openai, tiktoken) work out of the box. The
# corresponding [project.optional-dependencies] entries above are kept in
# sync so external `pip install medrap[viz]` / `medrap[llm_judge]` still
# works for PyPI users.
default-groups = ["dev", "llm_judge", "viz"]

[tool.setuptools_scm]

[tool.setuptools.package-data]
medrap = ["conf/**/*.yaml"]

[project.scripts]
medrap-train = "medrap.cli:train_main"
medrap-eval = "medrap.cli:eval_main"
medrap-prepare-retrieval-dataset = "medrap.cli:prepare_retrieval_dataset_main"
medrap-preprocess = "medrap.cli:preprocess_main"
medrap-retrieve = "medrap.cli:retrieve_main"

[tool.pytest.ini_options]
testpaths = ["tests", "src/medrap"]
addopts = [
  "--color=yes",
  "--doctest-modules",
  "--ignore=docs",
  "--ignore=MEDS-DEV",
  "--ignore=AGENTS.md",
  "--ignore=CONTRIBUTORS.md",
  "--ignore=src/medrap/prepare_retrieval/preparation.py",
  "--doctest-glob=*.md",
]
markers = []
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[project.urls]
Homepage = "https://github.com/McDermottHealthAI/MedRAP"
Issues = "https://github.com/McDermottHealthAI/MedRAP/issues"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs/index.md"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "N",   # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*" = ["DTZ001"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["*MEDS*", "*NRT*", "D", "*F1*", "*F2*", "*F3*", "*F4*", "*F5*"]
